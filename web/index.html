</style></head><body><header><div><h1>测试数据工坊</h1><p>为原型、接口与测试，生成可以复现的数据。</p></div><span class="badge">MoonBit Faker · 0.4.0 · 本地运行</span></header><main class="layout"><section class="card"><h2>01 / 配置数据</h2><label for="preset">数据示例</label><select id="preset"><option value="people">人员资料</option><option value="orders">关联订单</option></select><label for="locale">地区</label><select id="locale"><option value="zh_CN">简体中文 · 中国</option><option value="en_US">英语 · 美国</option><option value="en_GB">英语 · 英国</option><option value="fr_FR">法语 · 法国</option><option value="de_DE">德语 · 德国</option><option value="ja_JP">日语 · 日本</option></select><div class="twocol"><div><label for="count">行数</label><input id="count" type="number" min="0" max="1000" value="20"></div><div><label for="seed">种子</label><input id="seed" type="number" min="0" max="4294967295" value="42"></div></div><div class="actions"><button id="generate">生成数据</button><button id="cancel" disabled>取消</button></div><p class="hint">同一版本、配置与种子可复现。网页最多生成 1000 行；大量数据、跨表生成与暂停恢复可使用文件入口。</p></section><section class="card"><div class="preview-head"><h2>02 / 数据预览</h2><div class="download"><select id="format" aria-label="下载格式"><option value="jsonl">JSONL</option><option value="json">JSON</option><option value="csv">CSV</option></select><button id="save" disabled>下载数据</button></div></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><p id="status" role="status" aria-live="polite">正在准备…</p><p class="preview-note">预览显示前 50 行，下载包含本次生成的全部数据。对象与数组在 CSV 中保存为 JSON 单元格。</p></section></main><section class="editor"><details><summary>编辑 JSON 配置</summary><textarea id="job" aria-label="JSON 配置" spellcheck="false"></textarea><button id="run-json">运行配置</button></details></section><footer>数据由本机 MoonBit 引擎生成。地区数据来自 Faker 40.39.0，使用其默认回退地区；姓名和地址可能与真实信息重合。<a href="../README.md">使用说明</a> · <a href="../FEATURES.md">覆盖范围</a> · <a href="../third_party/Faker-LICENSE.txt">词库许可证</a></footer><script type="module" src=".
